name: Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "battle.js"
      - "event-system.js"
      - "map-navigation.js"
      - "styles.css"
      - "map-navigation.css"
      - "art-direction.css"
      - "service-worker.js"
      - "app.webmanifest"
      - "version.json"
      - "assets/**"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Verify PWA and prepare Android bundle
        run: |
          npm run test:pwa
          npm run prepare:android
          npm run test:android-bundle
      - name: Generate Android project and build debug APK
        run: |
          npx cap add android
          npx cap sync android
          cd android
          ./gradlew assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dalu-android-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
