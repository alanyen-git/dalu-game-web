name: 異界旅人 Android Debug APK


on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: write


concurrency:
  group: yijie-luren-apk-release
  cancel-in-progress: false


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Validate 異界旅人 and rebuild Android web bundle
        run: |
          npm run test:qunlu-app
          npm run prepare:qunlu
          npm run test:qunlu-bundle
      - name: Generate Android project and build debug APK
        run: |
