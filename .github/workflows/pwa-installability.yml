name: PWA Installability

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import pinned Qunlu character catalog
        run: node scripts/import-qunlu-catalog.cjs
      - name: Verify install manifest, icon files, offline shell, and navigation
        run: node tests/pwa-installability.test.js
